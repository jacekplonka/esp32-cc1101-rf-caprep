# ============================================================
# ESPHome RF Fan Controller — CC1101 @ 433.92 MHz ASK/OOK
# ============================================================
# Protocol: 29-bit messages  (20-bit device address + 9-bit command)
#
# Wiring (ESP32 → CC1101 module):
#   GPIO 18 → SCK        GPIO 5  → CSN
#   GPIO 19 → MISO       GPIO 25 → GDO0 (TX data)
#   GPIO 23 → MOSI       GPIO 26 → GDO2 (continuous RX)
#
# To change pins, edit the #defines in cc1101_fan_controller.h
# or override via build_flags below.
# ============================================================

esphome:
  name: fan-controller
  friendly_name: RF Fan Controller
  includes:
    - cc1101_fan_controller.h
  libraries:
    - SPI
    - CC1101-ESP-Arduino=https://github.com/jacekplonka/CC1101-ESP-Arduino.git
  on_boot:
    priority: -100
    then:
      - lambda: |-
          fan_ctrl.restore_state(
            id(dimmer_nibble), id(brighter_nibble), id(color_temperature_nibble),
            id(fan_faster_cursor_v2), id(slower_nibble), id(light_on_nibble),
            id(dimmer_nibble_2), id(brighter_nibble_2), id(color_temperature_nibble_2),
            id(fan_2_faster_cursor_v2), id(slower_nibble_2), id(fan_2_light_cursor_v2),
            id(last_remote_address), id(last_remote_command), id(last_fan_command),
            id(discovered_fan_address),
            id(fan_power_state_v2), id(fan_speed_state_v2), id(light_state_v2),
            id(fan_2_power_state_v2), id(fan_2_speed_state_v2), id(fan_2_light_state_v2));
          fan_ctrl.begin();
          id(fan_state_sync) = true;
          id(my_fan).state = fan_ctrl.fan_power_state(0) > 0;
          id(my_fan).speed = id(my_fan).state ? fan_ctrl.fan_speed_state(0) : 0;
          id(my_fan).publish_state();
          id(fan_64120).state = fan_ctrl.fan_power_state(1) > 0;
          id(fan_64120).speed = id(fan_64120).state ? fan_ctrl.fan_speed_state(1) : 0;
          id(fan_64120).publish_state();
          id(fan_state_sync) = false;

          if (fan_ctrl.last_remote_command() < 0) {
            id(last_remote_command_text).publish_state("No remote command seen");
          } else {
            char value[32];
            snprintf(value, sizeof(value), "0x%05X / 0x%03X",
                     (unsigned int)fan_ctrl.last_remote_address(),
                     (unsigned int)fan_ctrl.last_remote_command());
            id(last_remote_command_text).publish_state(value);
          }
          if (fan_ctrl.last_fan_command() < 0) {
            id(last_fan_command_text).publish_state("No command sent or received");
          } else {
            char value[16];
            snprintf(value, sizeof(value), "0x%03X", (unsigned int)fan_ctrl.last_fan_command());
            id(last_fan_command_text).publish_state(value);
          }
          if (fan_ctrl.discovered_address() < 0) {
            id(discovered_fan_address_text).publish_state("No address found");
          } else {
            char value[16];
            snprintf(value, sizeof(value), "0x%05X", (unsigned int)fan_ctrl.discovered_address());
            id(discovered_fan_address_text).publish_state(value);
          }

esp32:
  board: esp32dev
  framework:
    type: arduino
logger:

api:
  encryption:
    key: !secret fan_controller__encryption_key
ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid # TODO: Type in your WiFi SSID
  password: !secret wifi_password # TODO: Type in your WiFi password
  ap:
    ssid: "Fan-Controller-AP"
    password: "fan12345678"

captive_portal:

web_server:
  port: 80

# Poll the edge buffer without blocking the ESPHome main loop. A quiet period
# after the remote's repeated frames closes the packet and updates saved state.
interval:
  - interval: 10ms
    then:
      - lambda: |-
          fan_ctrl.loop();
          if (fan_ctrl.consume_state_update()) {
            const int previous_remote_address = id(last_remote_address);
            const int previous_remote_command = id(last_remote_command);
            const int previous_fan_command = id(last_fan_command);
            const int previous_discovered_address = id(discovered_fan_address);
            id(dimmer_nibble) = fan_ctrl.sequence_cursor(0, 0);
            id(brighter_nibble) = fan_ctrl.sequence_cursor(0, 1);
            id(color_temperature_nibble) = fan_ctrl.sequence_cursor(0, 2);
            id(fan_faster_cursor_v2) = fan_ctrl.sequence_cursor(0, 3);
            id(slower_nibble) = fan_ctrl.sequence_cursor(0, 4);
            id(light_on_nibble) = fan_ctrl.sequence_cursor(0, 5);
            id(dimmer_nibble_2) = fan_ctrl.sequence_cursor(1, 0);
            id(brighter_nibble_2) = fan_ctrl.sequence_cursor(1, 1);
            id(color_temperature_nibble_2) = fan_ctrl.sequence_cursor(1, 2);
            id(fan_2_faster_cursor_v2) = fan_ctrl.sequence_cursor(1, 3);
            id(slower_nibble_2) = fan_ctrl.sequence_cursor(1, 4);
            id(fan_2_light_cursor_v2) = fan_ctrl.sequence_cursor(1, 5);
            id(last_remote_address) = fan_ctrl.last_remote_address();
            id(last_remote_command) = fan_ctrl.last_remote_command();
            id(last_fan_command) = fan_ctrl.last_fan_command();
            id(discovered_fan_address) = fan_ctrl.discovered_address();
            id(fan_power_state_v2) = fan_ctrl.fan_power_state(0);
            id(fan_speed_state_v2) = fan_ctrl.fan_speed_state(0);
            id(light_state_v2) = fan_ctrl.light_state(0);
            id(fan_2_power_state_v2) = fan_ctrl.fan_power_state(1);
            id(fan_2_speed_state_v2) = fan_ctrl.fan_speed_state(1);
            id(fan_2_light_state_v2) = fan_ctrl.light_state(1);

            const bool fan_1_on = fan_ctrl.fan_power_state(0) > 0;
            const int fan_1_speed = fan_1_on ? fan_ctrl.fan_speed_state(0) : 0;
            if (id(my_fan).state != fan_1_on || id(my_fan).speed != fan_1_speed) {
              id(fan_state_sync) = true;
              id(my_fan).state = fan_1_on;
              id(my_fan).speed = fan_1_speed;
              id(my_fan).publish_state();
              id(fan_state_sync) = false;
            }

            const bool fan_2_on = fan_ctrl.fan_power_state(1) > 0;
            const int fan_2_speed = fan_2_on ? fan_ctrl.fan_speed_state(1) : 0;
            if (id(fan_64120).state != fan_2_on || id(fan_64120).speed != fan_2_speed) {
              id(fan_state_sync) = true;
              id(fan_64120).state = fan_2_on;
              id(fan_64120).speed = fan_2_speed;
              id(fan_64120).publish_state();
              id(fan_state_sync) = false;
            }

            if (fan_ctrl.last_remote_address() != previous_remote_address ||
                fan_ctrl.last_remote_command() != previous_remote_command) {
              if (fan_ctrl.last_remote_command() < 0) {
                id(last_remote_command_text).publish_state("No remote command seen");
              } else {
                char value[32];
                snprintf(value, sizeof(value), "0x%05X / 0x%03X",
                         (unsigned int)fan_ctrl.last_remote_address(),
                         (unsigned int)fan_ctrl.last_remote_command());
                id(last_remote_command_text).publish_state(value);
              }
            }
            if (fan_ctrl.last_fan_command() != previous_fan_command) {
              if (fan_ctrl.last_fan_command() < 0) {
                id(last_fan_command_text).publish_state("No command sent or received");
              } else {
                char value[16];
                snprintf(value, sizeof(value), "0x%03X",
                         (unsigned int)fan_ctrl.last_fan_command());
                id(last_fan_command_text).publish_state(value);
              }
            }
            if (fan_ctrl.discovered_address() != previous_discovered_address) {
              if (fan_ctrl.discovered_address() < 0) {
                id(discovered_fan_address_text).publish_state("No address found");
              } else {
                char value[16];
                snprintf(value, sizeof(value), "0x%05X",
                         (unsigned int)fan_ctrl.discovered_address());
                id(discovered_fan_address_text).publish_state(value);
              }
            }
          }

text_sensor:
  - platform: template
    id: last_remote_command_text
    name: "Fan Controller Last Remote Command"
    update_interval: never
  - platform: template
    id: last_fan_command_text
    name: "Fan Controller Last Command Code"
    update_interval: never
  - platform: template
    id: discovered_fan_address_text
    name: "Discovered Fan Address"
    update_interval: never

fan:
  - platform: template
    id: my_fan
    name: "My Fan"
    speed_count: 6
    restore_mode: NO_RESTORE
    on_turn_on:
      - lambda: 'if (!id(fan_state_sync)) fan_ctrl.fan_on(0);'
    on_turn_off:
      - lambda: 'if (!id(fan_state_sync)) fan_ctrl.fan_off(0);'
    on_speed_set:
      - lambda: 'if (!id(fan_state_sync)) fan_ctrl.fan_set_speed(0, x);'
  - platform: template
    id: fan_64120
    name: "Fan 0x64120"
    speed_count: 6
    restore_mode: NO_RESTORE
    on_turn_on:
      - lambda: 'if (!id(fan_state_sync)) fan_ctrl.fan_on(1);'
    on_turn_off:
      - lambda: 'if (!id(fan_state_sync)) fan_ctrl.fan_off(1);'
    on_speed_set:
      - lambda: 'if (!id(fan_state_sync)) fan_ctrl.fan_set_speed(1, x);'

binary_sensor:
  - platform: template
    name: "My Fan Light State"
    device_class: light
    update_interval: 1s
    lambda: |-
      return fan_ctrl.light_state(0) > 0;
  - platform: template
    name: "Fan 0x64120 Light State"
    device_class: light
    update_interval: 1s
    lambda: |-
      return fan_ctrl.light_state(1) > 0;

# Turn on to listen for a different fan's remote. Discovery accepts a new
# address after it sees the same frame twice, then turns itself off.
switch:
  - platform: template
    name: "Fan Address Discovery"
    lambda: 'return fan_ctrl.discovery_mode();'
    turn_on_action:
      - lambda: 'fan_ctrl.set_discovery_mode(true);'
    turn_off_action:
      - lambda: 'fan_ctrl.set_discovery_mode(false);'

# ============================================================
# FAN CONTROLS
# ============================================================
# Fan addresses and RF command sequences are defined in
# cc1101_fan_controller.h. YAML contains only Home Assistant entities and
# persistent state needed to resume each fan's command cycle.
# ============================================================

globals:
  - id: fan_state_sync
    type: bool
    restore_value: no
    initial_value: 'false'
  # Each value stores the next low nibble to send. Initial values select the
  # lowest valid code in each cycle; the listener resyncs them from the remote.
  - id: dimmer_nibble
    type: int
    restore_value: yes
    initial_value: '0'
  - id: brighter_nibble
    type: int
    restore_value: yes
    initial_value: '1'
  - id: color_temperature_nibble
    type: int
    restore_value: yes
    initial_value: '3'
  # Versioned IDs reset the old incorrect cycle seed. The receiver will
  # resynchronize these cursors from the next command sent by the remote.
  - id: fan_faster_cursor_v2
    type: int
    restore_value: yes
    initial_value: '6'
  - id: slower_nibble
    type: int
    restore_value: yes
    initial_value: '0'
  - id: light_on_nibble
    type: int
    restore_value: yes
    initial_value: '5'
  - id: dimmer_nibble_2
    type: int
    restore_value: yes
    initial_value: '0'
  - id: brighter_nibble_2
    type: int
    restore_value: yes
    initial_value: '1'
  - id: color_temperature_nibble_2
    type: int
    restore_value: yes
    initial_value: '3'
  - id: fan_2_faster_cursor_v2
    type: int
    restore_value: yes
    initial_value: '6'
  - id: slower_nibble_2
    type: int
    restore_value: yes
    initial_value: '0'
  - id: fan_2_light_cursor_v2
    type: int
    restore_value: yes
    initial_value: '5'
  - id: last_remote_address
    type: int
    restore_value: yes
    initial_value: '-1'
  - id: last_remote_command
    type: int
    restore_value: yes
    initial_value: '-1'
  - id: last_fan_command
    type: int
    restore_value: yes
    initial_value: '-1'
  - id: discovered_fan_address
    type: int
    restore_value: yes
    initial_value: '-1'
  # The fans do not report their state. Start with an off baseline, then
  # persist state inferred from commands sent by HA or the original remote.
  - id: fan_power_state_v2
    type: int
    restore_value: yes
    initial_value: '0'
  - id: fan_speed_state_v2
    type: int
    restore_value: yes
    initial_value: '0'
  - id: light_state_v2
    type: int
    restore_value: yes
    initial_value: '0'
  - id: fan_2_power_state_v2
    type: int
    restore_value: yes
    initial_value: '0'
  - id: fan_2_speed_state_v2
    type: int
    restore_value: yes
    initial_value: '0'
  - id: fan_2_light_state_v2
    type: int
    restore_value: yes
    initial_value: '0'

