# ============================================================
# ESPHome RF Fan Controller — CC1101 @ 433.92 MHz ASK/OOK
# ============================================================
# Protocol: 29-bit messages  (20-bit device address + 9-bit command)
#
# Wiring (ESP32 → CC1101 module):
#   GPIO 18 → SCK        GPIO 5  → CSN
#   GPIO 19 → MISO       GPIO 25 → GDO0 (TX data)
#   GPIO 23 → MOSI       GPIO 26 → GDO2 (RX, unused here)
#
# To change pins, edit the #defines in cc1101_fan_controller.h
# or override via build_flags below.
# ============================================================

esphome:
  name: fan-controller
  friendly_name: RF Fan Controller
  includes:
    - cc1101_fan_controller.h
  libraries:
    - SPI
    - CC1101-ESP-Arduino=https://github.com/jacekplonka/CC1101-ESP-Arduino.git
  on_boot:
    priority: 600
    then:
      - lambda: 'fan_ctrl.begin();'

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

api:
  encryption:
    key: "" # TODO: Generate a random key:  esphome wizard, or https://esphome.io/components/api

ota:
  - platform: esphome
    password: "" # TODO: Generate a random password:  esphome wizard, or https://esphome.io/components/api

wifi:
  ssid: "" # TODO: Type in your WiFi SSID
  password: "" # TODO: Type in your WiFi password
  ap:
    ssid: "Fan-Controller-AP"
    password: "fan12345678"

captive_portal:

web_server:
  port: 80

# ============================================================
# FAN CONTROLS
# ============================================================
# Each fan has a unique 20-bit address.  Commands are shared
# across all fans (defined in cc1101_fan_controller.h).
#
# Known device addresses:
#   My Fan   → 0x94120
#
# To add a new fan:
#   1. Capture its signal with the Arduino recorder
#   2. Decode the 20-bit address
#   3. Copy a button block below, update name, id & address
# ============================================================

globals:
  # Index of the last dimmer code sent: A=0, C=1, E=2, 0=3, ... 8=7.
  # 2 matches the last captured physical-remote value, 0x15E.
  - id: dimmer_sequence
    type: int
    restore_value: yes
    initial_value: '2'
  # Last Brighter sequence position; starts after D so first press sends F.
  - id: brighter_sequence
    type: int
    restore_value: yes
    initial_value: '7'
  # The last captured color-temperature code was 0x0B3; start at the next +4 value.
  - id: color_temperature_code
    type: int
    restore_value: yes
    initial_value: '183'
  # These roll independently, starting with the captured base codes.
  - id: faster_code
    type: int
    restore_value: yes
    initial_value: '66'
  - id: slower_code
    type: int
    restore_value: yes
    initial_value: '40'
# ── Raw Command Input (for protocol exploration) ────────────

number:
  - platform: template
    name: "Raw Command Code"
    id: raw_cmd_code
    icon: "mdi:console"
    optimistic: true
    min_value: 0
    max_value: 511
    step: 1
    initial_value: 0
    mode: box

# ── Fan Action Buttons ───────────────────────────────────────

button:
  - platform: template
    name: "My Fan - On"
    icon: "mdi:power"
    on_press:
      - lambda: 'fan_ctrl.send_command(0x94120, 0x020);'

  - platform: template
    name: "My Fan - Off"
    icon: "mdi:power-off"
    on_press:
      - lambda: 'fan_ctrl.send_command(0x94120, 0x093);'

  - platform: template
    name: "My Fan - Light Color Temperature"
    icon: "mdi:thermometer"
    on_press:
      - lambda: |-
          uint16_t cmd = id(color_temperature_code);
          ESP_LOGI("fan_roll", "Color temperature code 0x%03X", cmd);
          fan_ctrl.send_command(0x94120, cmd);
          id(color_temperature_code) = (cmd + 4) & 0x1FF;

  - platform: template
    name: "My Fan - Direction"
    icon: "mdi:swap-vertical"
    on_press:
      - lambda: 'fan_ctrl.send_command(0x94120, 0x0E4);'

  - platform: template
    name: "My Fan - Dimmer"
    icon: "mdi:brightness-6"
    on_press:
      - lambda: |-
          // Cycle low nibble: A, C, E, 0, 2, 4, 6, 8.
          id(dimmer_sequence) = (id(dimmer_sequence) + 1) % 8;
          const uint16_t code = 0x150 | ((0x0A + 2 * id(dimmer_sequence)) & 0x0F);
          ESP_LOGI("dimmer", "Sending 0x%03X", code);
          fan_ctrl.send_command(0x94120, code);

  - platform: template
    name: "My Fan - Brighter"
    icon: "mdi:brightness-7"
    on_press:
      - lambda: |-
          // Cycle low nibble: F, 1, 3, 5, 7, 9, B, D.
          id(brighter_sequence) = (id(brighter_sequence) + 1) % 8;
          const uint16_t code = 0x100 | ((0x0F + 2 * id(brighter_sequence)) & 0x0F);
          ESP_LOGI("brighter", "Sending 0x%03X", code);
          fan_ctrl.send_command(0x94120, code);

  - platform: template
    name: "My Fan - Faster"
    icon: "mdi:fan-plus"
    on_press:
      - lambda: |-
          uint16_t cmd = id(faster_code);
          ESP_LOGI("fan_roll", "Faster code 0x%03X", cmd);
          fan_ctrl.send_command(0x94120, cmd);
          id(faster_code) = (cmd + 4) & 0x1FF;

  - platform: template
    name: "My Fan - Slower"
    icon: "mdi:fan-minus"
    on_press:
      - lambda: |-
          uint16_t cmd = id(slower_code);
          ESP_LOGI("fan_roll", "Slower code 0x%03X", cmd);
          fan_ctrl.send_command(0x94120, cmd);
          id(slower_code) = (cmd + 4) & 0x1FF;

  - platform: template
    name: "Record RF Signal"
    icon: "mdi:radio-tower"
    on_press:
      - lambda: 'fan_ctrl.record_signal();'

  - platform: template
    name: "Send Raw Command (My Fan)"
    icon: "mdi:send"
    on_press:
      - lambda: |-
          uint16_t cmd = (uint16_t)id(raw_cmd_code).state;
          ESP_LOGI("raw_cmd", "Sending raw command %d (0x%03X) to My Fan", cmd, cmd);
          fan_ctrl.send_command(0x94120, cmd);