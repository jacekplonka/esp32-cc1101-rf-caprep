# ============================================================
# ESPHome RF Fan Controller — CC1101 @ 433.92 MHz ASK/OOK
# ============================================================
# Protocol: 29-bit messages  (20-bit device address + 9-bit command)
#
# Set the six cc1101_*_pin substitutions below to match your wiring.
# ============================================================

substitutions:
  cc1101_sck_pin: "18" # SCK
  cc1101_miso_pin: "19" # MISO
  cc1101_mosi_pin: "23" # MOSI
  cc1101_cs_pin: "5" # CSN
  cc1101_gdo0_pin: "25" # TX data
  cc1101_gdo2_pin: "26" # RX input

esphome:
  name: fan-controller
  friendly_name: RF Fan Controller
  build_flags:
    - "-DCC1101_SCK_PIN=${cc1101_sck_pin}"
    - "-DCC1101_MISO_PIN=${cc1101_miso_pin}"
    - "-DCC1101_MOSI_PIN=${cc1101_mosi_pin}"
    - "-DCC1101_CS_PIN=${cc1101_cs_pin}"
    - "-DCC1101_GDO0_PIN=${cc1101_gdo0_pin}"
    - "-DCC1101_GDO2_PIN=${cc1101_gdo2_pin}"
  includes:
    - cc1101_fan_controller.h
  libraries:
    - SPI
    - CC1101-ESP-Arduino=https://github.com/jacekplonka/CC1101-ESP-Arduino.git
  # The setup lambda only binds ESPHome entities/storage to the C++ controller.
  on_boot:
    priority: 600
    then:
      - lambda: |-
          fan_ctrl.bind_entities(
              id(my_fan), id(fan_64120),
              id(office_fan_light_state), id(bedroom_fan_light_state),
              id(last_remote_command_text), id(last_fan_command_text),
              id(discovered_fan_address_text), id(fan_address_discovery));
          fan_ctrl.bind_buttons(
              {id(office_light_toggle_button), id(office_color_temperature_button),
               id(office_direction_button), id(office_dimmer_button),
               id(office_brighter_button), id(office_max_brightness_button),
               id(office_min_brightness_button)},
              {id(bedroom_light_toggle_button), id(bedroom_color_temperature_button),
               id(bedroom_direction_button), id(bedroom_dimmer_button),
               id(bedroom_brighter_button), id(bedroom_max_brightness_button),
               id(bedroom_min_brightness_button)});
          fan_ctrl.bind_persistent_values({
              &id(dimmer_nibble), &id(brighter_nibble), &id(color_temperature_nibble),
              &id(fan_faster_cursor_v2), &id(slower_nibble), &id(light_on_nibble),
              &id(dimmer_nibble_2), &id(brighter_nibble_2), &id(color_temperature_nibble_2),
              &id(fan_2_faster_cursor_v2), &id(slower_nibble_2), &id(fan_2_light_cursor_v2),
              &id(last_remote_address), &id(last_remote_command), &id(last_fan_command),
              &id(discovered_fan_address), &id(fan_power_state_v2), &id(fan_speed_state_v2),
              &id(light_state_v2), &id(fan_2_power_state_v2), &id(fan_2_speed_state_v2),
              &id(fan_2_light_state_v2)});
          fan_ctrl.begin();

esp32:
  board: esp32dev
  framework:
    type: arduino
logger:

api:
  encryption:
    key: !secret fan_controller__encryption_key
ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid # TODO: Type in your WiFi SSID
  password: !secret wifi_password # TODO: Type in your WiFi password
  ap:
    ssid: "Fan-Controller-AP"
    password: "fan12345678"

captive_portal:

web_server:
  port: 80

# Poll the edge buffer without blocking the ESPHome main loop. A quiet period
# after the remote's repeated frames closes the packet and updates saved state.
interval:
  - interval: 10ms
    then:
      - lambda: 'fan_ctrl.loop();'

text_sensor:
  - platform: template
    id: last_remote_command_text
    name: "Fan Controller Last Remote Command"
    entity_category: diagnostic
    update_interval: never
  - platform: template
    id: last_fan_command_text
    name: "Fan Controller Last Command Code"
    entity_category: diagnostic
    update_interval: never
  - platform: template
    id: discovered_fan_address_text
    name: "Discovered Fan Address"
    entity_category: diagnostic
    update_interval: never

fan:
  - platform: template
    id: my_fan
    name: "Office Fan"
    speed_count: 6
    restore_mode: NO_RESTORE
  - platform: template
    id: fan_64120
    name: "Bedroom Fan"
    speed_count: 6
    restore_mode: NO_RESTORE

binary_sensor:
  - platform: template
    id: office_fan_light_state
    name: "Office Fan Light State"
    device_class: light
  - platform: template
    id: bedroom_fan_light_state
    name: "Bedroom Fan Light State"
    device_class: light

# Turn on to listen for a different fan's remote. Discovery accepts a new
# address after it sees the same frame twice, then turns itself off.
switch:
  - platform: template
    id: fan_address_discovery
    name: "Fan Address Discovery"
    entity_category: diagnostic
    optimistic: true

# ============================================================
# FAN CONTROLS
# ============================================================
# Fan addresses and RF command sequences are defined in
# cc1101_fan_controller.h. The globals below are persistent state only.
# ============================================================

globals:
  # Each value stores the next low nibble to send. Initial values select the
  # lowest valid code in each cycle; the listener resyncs them from the remote.
  - id: dimmer_nibble
    type: int
    restore_value: yes
    initial_value: '0'
  - id: brighter_nibble
    type: int
    restore_value: yes
    initial_value: '1'
  - id: color_temperature_nibble
    type: int
    restore_value: yes
    initial_value: '3'
  # Versioned IDs reset the old incorrect cycle seed. The receiver will
  # resynchronize these cursors from the next command sent by the remote.
  - id: fan_faster_cursor_v2
    type: int
    restore_value: yes
    initial_value: '6'
  - id: slower_nibble
    type: int
    restore_value: yes
    initial_value: '0'
  - id: light_on_nibble
    type: int
    restore_value: yes
    initial_value: '5'
  - id: dimmer_nibble_2
    type: int
    restore_value: yes
    initial_value: '0'
  - id: brighter_nibble_2
    type: int
    restore_value: yes
    initial_value: '1'
  - id: color_temperature_nibble_2
    type: int
    restore_value: yes
    initial_value: '3'
  - id: fan_2_faster_cursor_v2
    type: int
    restore_value: yes
    initial_value: '6'
  - id: slower_nibble_2
    type: int
    restore_value: yes
    initial_value: '0'
  - id: fan_2_light_cursor_v2
    type: int
    restore_value: yes
    initial_value: '5'
  - id: last_remote_address
    type: int
    restore_value: yes
    initial_value: '-1'
  - id: last_remote_command
    type: int
    restore_value: yes
    initial_value: '-1'
  - id: last_fan_command
    type: int
    restore_value: yes
    initial_value: '-1'
  - id: discovered_fan_address
    type: int
    restore_value: yes
    initial_value: '-1'
  # The fans do not report their state. Start with an off baseline, then
  # persist state inferred from commands sent by HA or the original remote.
  - id: fan_power_state_v2
    type: int
    restore_value: yes
    initial_value: '0'
  - id: fan_speed_state_v2
    type: int
    restore_value: yes
    initial_value: '0'
  - id: light_state_v2
    type: int
    restore_value: yes
    initial_value: '0'
  - id: fan_2_power_state_v2
    type: int
    restore_value: yes
    initial_value: '0'
  - id: fan_2_speed_state_v2
    type: int
    restore_value: yes
    initial_value: '0'
  - id: fan_2_light_state_v2
    type: int
    restore_value: yes
    initial_value: '0'

# Button order in each fan group matches the action table in the C++ controller.
button:
