# ============================================================
# ESPHome RF Fan Controller — CC1101 @ 433.92 MHz ASK/OOK
# ============================================================
# Protocol: 29-bit messages  (20-bit device address + 9-bit command)
#
# Wiring (ESP32 → CC1101 module):
#   GPIO 18 → SCK        GPIO 5  → CSN
#   GPIO 19 → MISO       GPIO 25 → GDO0 (TX data)
#   GPIO 23 → MOSI       GPIO 26 → GDO2 (continuous RX)
#
# To change pins, edit the #defines in cc1101_fan_controller.h
# or override via build_flags below.
# ============================================================

esphome:
  name: fan-controller
  friendly_name: RF Fan Controller
  includes:
    - cc1101_fan_controller.h
  libraries:
    - SPI
    - CC1101-ESP-Arduino=https://github.com/jacekplonka/CC1101-ESP-Arduino.git
  on_boot:
    priority: -100
    then:
      - lambda: |-
          fan_ctrl.restore_state(
            id(dimmer_nibble), id(brighter_nibble), id(color_temperature_nibble),
            id(fan_faster_nibble), id(slower_nibble), id(light_on_nibble),
            id(last_remote_address), id(last_remote_command), id(last_fan_command),
            id(discovered_fan_address),
            id(fan_power_state), id(fan_speed_state), id(light_state));
          fan_ctrl.begin();

esp32:
  board: esp32dev
  framework:
    type: arduino
logger:

api:
  encryption:
    key: !secret fan_controller__encryption_key
ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid # TODO: Type in your WiFi SSID
  password: !secret wifi_password # TODO: Type in your WiFi password
  ap:
    ssid: "Fan-Controller-AP"
    password: "fan12345678"

captive_portal:

web_server:
  port: 80

# Poll the edge buffer without blocking the ESPHome main loop. A quiet period
# after the remote's repeated frames closes the packet and updates saved state.
interval:
  - interval: 10ms
    then:
      - lambda: |-
          fan_ctrl.loop();
          if (fan_ctrl.consume_state_update()) {
            id(dimmer_nibble) = fan_ctrl.sequence_cursor(0);
            id(brighter_nibble) = fan_ctrl.sequence_cursor(1);
            id(color_temperature_nibble) = fan_ctrl.sequence_cursor(2);
            id(fan_faster_nibble) = fan_ctrl.sequence_cursor(3);
            id(slower_nibble) = fan_ctrl.sequence_cursor(4);
            id(light_on_nibble) = fan_ctrl.sequence_cursor(5);
            id(last_remote_address) = fan_ctrl.last_remote_address();
            id(last_remote_command) = fan_ctrl.last_remote_command();
            id(last_fan_command) = fan_ctrl.last_fan_command();
            id(discovered_fan_address) = fan_ctrl.discovered_address();
            id(fan_power_state) = fan_ctrl.fan_power_state();
            id(fan_speed_state) = fan_ctrl.fan_speed_state();
            id(light_state) = fan_ctrl.light_state();
          }

text_sensor:
  - platform: template
    name: "Fan Controller State"
    update_interval: 10s
    lambda: |-
      if (id(fan_power_state) < 0) return {"Unknown"};
      if (id(fan_power_state) == 0) return {"Off"};
      if (id(fan_speed_state) > 0) {
        char state[32];
        snprintf(state, sizeof(state), "On, speed %d", id(fan_speed_state));
        return {state};
      }
      return {"On, speed unknown"};
  - platform: template
    name: "Fan Controller Last Remote Command"
    update_interval: 10s
    lambda: |-
      if (id(last_remote_command) < 0) return {"No remote command seen"};
      char value[32];
      snprintf(value, sizeof(value), "0x%05X / 0x%03X",
               (unsigned int)id(last_remote_address), (unsigned int)id(last_remote_command));
      return {value};
  - platform: template
    name: "Fan Controller Last Command Code"
    update_interval: 10s
    lambda: |-
      if (id(last_fan_command) < 0) return {"No command sent or received"};
      char value[16];
      snprintf(value, sizeof(value), "0x%03X", (unsigned int)id(last_fan_command));
      return {value};
  - platform: template
    name: "Discovered Fan Address"
    update_interval: 2s
    lambda: |-
      if (id(discovered_fan_address) < 0) return {"No address found"};
      char value[16];
      snprintf(value, sizeof(value), "0x%05X", (unsigned int)id(discovered_fan_address));
      return {value};
  - platform: template
    name: "Fan Light State"
    update_interval: 10s
    lambda: |-
      if (id(light_state) < 0) return {"Unknown"};
      if (id(light_state)) return {"On"};
      return {"Off"};

# Turn on to listen for a different fan's remote. Discovery accepts a new
# address after it sees the same frame twice, then turns itself off.
switch:
  - platform: template
    name: "Fan Address Discovery"
    update_interval: 1s
    lambda: 'return fan_ctrl.discovery_mode();'
    turn_on_action:
      - lambda: 'fan_ctrl.set_discovery_mode(true);'
    turn_off_action:
      - lambda: 'fan_ctrl.set_discovery_mode(false);'

# ============================================================
# FAN CONTROLS
# ============================================================
# Each fan has a unique 20-bit address.  Commands are shared
# across all fans (defined in cc1101_fan_controller.h).
#
# Known device addresses:
#   My Fan   → 0x1AC12
#
# To add a new fan:
#   1. Capture its signal with the Arduino recorder
#   2. Decode the 20-bit address
#   3. Copy a select + buttons block below, update name, id & address
# ============================================================

# ── Raw Command Input (for protocol exploration) ────────────

globals:
   # Each value stores the next low nibble to send. Initial values select the
   # lowest valid code in each cycle; the listener resyncs them from the remote.
  - id: dimmer_nibble
    type: int
    restore_value: yes
    initial_value: '0'
  - id: brighter_nibble
    type: int
    restore_value: yes
    initial_value: '1'
  - id: color_temperature_nibble
    type: int
    restore_value: yes
    initial_value: '3'
  # New ID avoids restoring the obsolete 0x040/+4 cursor from older firmware.
  - id: fan_faster_nibble
    type: int
    restore_value: yes
    initial_value: '0'
  - id: slower_nibble
    type: int
    restore_value: yes
    initial_value: '0'
  - id: light_on_nibble
    type: int
    restore_value: yes
    initial_value: '1'
  - id: last_remote_address
    type: int
    restore_value: yes
    initial_value: '-1'
  - id: last_remote_command
    type: int
    restore_value: yes
    initial_value: '-1'
  - id: last_fan_command
    type: int
    restore_value: yes
    initial_value: '-1'
  - id: discovered_fan_address
    type: int
    restore_value: yes
    initial_value: '-1'
  - id: fan_power_state
    type: int
    restore_value: yes
    initial_value: '-1'
  - id: fan_speed_state
    type: int
    restore_value: yes
    initial_value: '-1'
  - id: light_state
    type: int
    restore_value: yes
    initial_value: '-1'

number:
  - platform: template
    name: "Raw Command Code"
    id: raw_cmd_code
    icon: "mdi:console"
    optimistic: true
    min_value: 0
    max_value: 511
    step: 1
    initial_value: 0
    mode: box

# ── Fan Action Buttons ───────────────────────────────────────

button:
  - platform: template
    name: "My Fan - On"
    icon: "mdi:power"
    on_press:
      - lambda: 'fan_ctrl.send_command(0x94120, 0x020);'

  - platform: template
    name: "My Fan - Off"
    icon: "mdi:power-off"
    on_press:
      - lambda: 'fan_ctrl.send_command(0x94120, 0x093);'

  # - platform: template
  #   name: "My Fan - Light Off"
  #   icon: "mdi:lightbulb-off"
  #   on_press:
  #     - lambda: 'fan_ctrl.send_cyclic_command(0x94120, 0x160, id(light_off_nibble), 4);'
  - platform: template
    name: "My Fan - Light Toggle"
    icon: "mdi:lightbulb-on"
    on_press:
      - lambda: 'fan_ctrl.send_cyclic_command(0x94120, 0x160, id(light_on_nibble), 2);'
  - platform: template
    name: "My Fan - Light Color Temperature"
    icon: "mdi:thermometer"
    on_press:
      - lambda: 'fan_ctrl.send_cyclic_command(0x94120, 0x0B0, id(color_temperature_nibble), 4, 7);'
  - platform: template
    name: "My Fan - Direction"
    icon: "mdi:swap-vertical"
    on_press:
      - lambda: 'fan_ctrl.send_command(0x94120, 0x0E4);'

  - platform: template
    name: "My Fan - Dimmer"
    icon: "mdi:brightness-6"
    on_press:
      - lambda: 'fan_ctrl.send_cyclic_command(0x94120, 0x150, id(dimmer_nibble), 2);'
  - platform: template
    name: "My Fan - Brighter"
    icon: "mdi:brightness-7"
    on_press:
      - lambda: 'fan_ctrl.send_cyclic_command(0x94120, 0x100, id(brighter_nibble), 2);'
  - platform: template
    name: "My Fan - Max Brightness (7s)"
    icon: "mdi:brightness-7"
    on_press:
      - lambda: 'fan_ctrl.repeat_cyclic_command_for(0x94120, 0x100, id(brighter_nibble), 2, 7000);'
  - platform: template
    name: "My Fan - Min Brightness (7s)"
    icon: "mdi:brightness-5"
    on_press:
      - lambda: 'fan_ctrl.repeat_cyclic_command_for(0x94120, 0x150, id(dimmer_nibble), 2, 7000);'
  - platform: template
    name: "My Fan - Faster"
    icon: "mdi:fan-plus"
    on_press:
      # Cycles 0x0C6, 0x0C8, 0x0CA, 0x0CC, 0x0CE, 0x0C0, 0x0C2, 0x0C4.
      - lambda: 'fan_ctrl.send_cyclic_command(0x94120, 0x0C0, id(fan_faster_nibble), 2);'
  - platform: template
    name: "My Fan - Slower"
    icon: "mdi:fan-minus"
    on_press:
      - lambda: 'fan_ctrl.send_cyclic_command(0x94120, 0x020, id(slower_nibble), 2);'
  - platform: template
    name: "My Fan - Max Speed"
    icon: "mdi:fan-chevron-up"
    on_press:
      - lambda: 'fan_ctrl.send_cyclic_burst(0x94120, 0x0C0, id(fan_faster_nibble), 2, 5);'
  - platform: template
    name: "My Fan - Min Speed"
    icon: "mdi:fan-chevron-down"
    on_press:
      - lambda: 'fan_ctrl.send_cyclic_burst(0x94120, 0x020, id(slower_nibble), 2, 5);'

  # ── RF Listener Diagnostics ──
  - platform: template
    name: "Log Next RF Command"
    icon: "mdi:radio-tower"
    on_press:
      - lambda: 'fan_ctrl.record_signal();'

  # ── Raw Command Sender (My Fan) ──
  - platform: template
    name: "Send Raw Command (My Fan)"
    icon: "mdi:send"
    on_press:
      - lambda: |-
          uint16_t cmd = (uint16_t)id(raw_cmd_code).state;
          ESP_LOGI("raw_cmd", "Sending raw command %d (0x%03X) to My Fan", cmd, cmd);
          fan_ctrl.send_command(0x94120, cmd);
